{# The demo page's look (14 Oct 2026): teal + mint, bills blue, spends gold, dots instead of emojis. Only on /demo. #}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root {
    --bg: #f3f5f4; --card: #ffffff; --text: #14201c; --muted: #5d6b66; --border: #dde3e0; --row: #eef2f0;
    --accent: #0f6e5c; --on-accent: #ffffff; --good: #138a5e; --bad: #c8463a;
    --bill: #2f6fd0; --spend: #b07d00; --spare: #13a07a; --ring-bg: #dde3e0;
    --zused: #b53aab; --zfree: #c3b6ea; --zfreetext: #6b5a9e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1513; --card: #171f1c; --text: #e9f0ed; --muted: #93a39d; --border: #26332f; --row: #1d2724;
      --accent: #3fd0a4; --on-accent: #06221b; --good: #3fd0a4; --bad: #f07a6a;
      --bill: #7fb0ff; --spend: #f2b632; --spare: #3fd0a4; --ring-bg: #26332f;
      --zused: #e06cd8; --zfree: #6b5a9e; --zfreetext: #a99ad6;
    }
  }
  body.demo { font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .demo .wrap { max-width: 1000px; }
  .demo button { background: var(--accent); color: var(--on-accent); font-family: inherit; font-weight: 700; border-radius: 10px; }
  .demo button.small { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 600; }
  .demo button.link, .demo .card h2 .fold { background: none; color: inherit; font-weight: inherit; }
  .demo .card h2 .fold { color: var(--muted); }
  .demo .seg button { background: var(--bg); color: var(--text); }
  .demo .seg button.on { background: var(--accent); color: var(--on-accent); }
  .demo input[type=text], .demo textarea { border-radius: 10px; font-family: inherit; }
  .demo .card { border-radius: 16px; padding: 20px; }
  .demo .card h2 { font-size: 18px; font-weight: 800; }
  .demo .tile { border-radius: 14px; text-align: left; }
  .demo .label, .demo .tile .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .demo .dropbar { border-radius: 14px; }

  /* name + icon */
  .demo .brand { display: inline-flex; align-items: flex-start; gap: 12px; margin: 4px 0 14px -6px; min-width: 0; padding: 6px 12px 6px 6px;
                 border-radius: 14px; color: inherit; text-decoration: none; }
  .demo .brand:hover { background: var(--card); }
  .demo .brand img { transition: transform .6s ease; }
  .demo .brand.spin img { transform: rotate(360deg); }
  .demo .brand:focus-visible { outline: 2px solid var(--accent); }
  .demo .brand img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
  .demo .brand h1 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1; }
  .demo .tagline { color: var(--spare); font-weight: 700; font-size: 14px; margin-top: 6px; }
  /* fixed header: home button left, settings right */
  .demo .wrap { overflow: clip; padding-top: 0; }
  .demohead { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 12px;
              background: var(--bg); padding: 10px 0; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  .demohead .brand { margin: 0 0 0 -6px; }
  /* the arrow tab on the header line, and the New payday panel it opens */
  .demohead { position: sticky; }
  .demohead .tab { position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 50%); width: 46px; height: 22px; padding: 0;
                   border-radius: 99px; border: 1px solid var(--border); background: var(--bg); color: var(--accent); font-size: 12px; line-height: 1; }
  .demohead .tab:hover { border-color: var(--accent); }
  .demohead .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .quick { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; border-color: var(--accent); margin-top: 6px; }
  .quick[hidden] { display: none; }
  .q-title { font-weight: 800; margin-bottom: 10px; }
  .q-fields { display: flex; gap: 12px; flex-wrap: wrap; }
  .q-fields label { display: grid; gap: 4px; flex: 1 1 140px; min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .q-fields input.amount { width: 100%; font-size: 16px; font-weight: 600; letter-spacing: 0; text-transform: none; }
  .lx { display: flex; gap: 6px; align-items: center; } .lx button { flex: none; }
  .demo .q-go { width: 100%; margin-top: 12px; padding: 11px; font-size: 16px; }
  .q-drop { display: flex; } .q-drop .dropbar { flex: 1; margin: 0; display: flex; align-items: center; justify-content: center; }
  @media (max-width: 700px) { .quick { grid-template-columns: 1fr; } }
  .settings { position: relative; align-self: flex-start; margin-top: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .appver { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .setmenu { position: absolute; right: 0; top: calc(100% + 8px); background: var(--card); border: 1px solid var(--border);
             border-radius: 14px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); min-width: 210px; }
  .setmenu[hidden] { display: none; }
  #setbtn { white-space: nowrap; flex: none; }
  @media (max-width: 440px) { .demo .brand h1 { font-size: 19px; white-space: nowrap; } .demo .brand img { width: 42px; height: 42px; } }
  body.editing .setmenu { display: block; }
  .demo .setmenu .editbar { flex-direction: column; align-items: stretch; margin: 0; }
  .demo .setmenu .editbar button { width: 100%; text-align: left; }
  .demo .setmenu .editbar form button { width: 100%; }

  /* dots instead of emojis */
  .demo .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; background: var(--muted); }
  .demo .dot.bill { background: var(--bill); } .demo .dot.spend { background: var(--spend); }
  .demo .dot.spare { background: var(--spare); } .demo .dot.ask { background: var(--accent); }

  /* top: the statement + ring, tiles on the right */
  .st-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; margin-bottom: 18px; }
  .st-grid .card { margin: 0; }
  .st-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .st-head .big { font-size: 52px; font-weight: 800; line-height: 1.05; color: var(--spare); }
  .st-key { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .st-key .dot { width: 8px; height: 8px; margin: 0 5px 0 0; }
  #ring { width: 92px; height: 92px; flex: none; }
  #ring circle { fill: none; stroke-width: 6; }
  #ring .ring-bg { stroke: var(--ring-bg); }
  #ring .seg-bill { stroke: var(--bill); } #ring .seg-spend { stroke: var(--spend); } #ring .seg-spare { stroke: var(--spare); }
  #ring text { fill: var(--text); font: 800 20px "Manrope", system-ui, sans-serif; }
  .st-rows { margin-top: 14px; }
  .st-rows .r { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--border); }
  .st-rows .r > span:first-child { color: var(--muted); }
  .st-rows .r.tot { border-top: 2px solid var(--text); font-weight: 800; }
  .st-rows .r.tot > span:first-child { color: var(--text); }
  .st-rows .tap { font-weight: 700; }
  .st-edit { display: flex; gap: 8px; justify-content: flex-end; padding: 0 0 10px; }
  .st-edit[hidden] { display: none; }
  .st-edit button[type=submit]:not(.small) { width: auto; }
  .k-bill { color: var(--bill); font-weight: 700; } .k-spend { color: var(--spend); font-weight: 700; }
  .st-side { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
  .st-side .tile { padding: 16px; }
  .st-side .tile .num { font-size: 24px; font-weight: 800; }
  .st-side .wide { grid-column: 1 / -1; }
  /* Zopa: ring of the limit, used pink-purple, free lilac */
  .zcard { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  .zl { display: grid; gap: 6px; min-width: 0; }
  .zrow { display: flex; align-items: center; font-size: 15px; }
  .zrow span { color: var(--muted); min-width: 46px; } .zrow b { margin-left: 6px; }
  .demo .dot.zused { background: var(--zused); } .demo .dot.zfree { background: var(--zfree); }
  .zfreeval { color: var(--zfreetext); }
  .zlimit { font-size: 12px; color: var(--muted); }
  #zring { width: 96px; height: 96px; flex: none; }
  #zring circle { fill: none; stroke-width: 6; }
  #zring .z-free { stroke: var(--zfree); } #zring .z-used { stroke: var(--zused); }
  #zring .z-pc { fill: var(--text); font: 800 20px "Manrope", system-ui, sans-serif; }
  #zring .z-sub { fill: var(--muted); font: 600 10px "Manrope", system-ui, sans-serif; }
  @media (max-width: 760px) { .st-grid { grid-template-columns: 1fr; } }
  @media (max-width: 420px) { .st-head .big { font-size: 42px; } #ring { width: 76px; height: 76px; } }

  /* spends gold, bills blue */
  .demo [data-card="spend"] h2, .demo [data-card="spend"] td.n { color: var(--spend); }
  .demo [data-card="spend"] td.n button { color: var(--text); }
  .demo [data-card="spend"] form.inline button[type=submit]:not(.small) { background: var(--spend); color: #1d1500; }
  .demo [data-card="bills"] h2 { color: var(--bill); }
  .demo [data-card="bills"] tr.bill button.link:not(.muted) { color: var(--bill); font-weight: 700; }
  .demo [data-card="bills"] #btotal { color: var(--bill); }
</style>
